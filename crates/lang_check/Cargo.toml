[package]
name = "lang_check"
version = "0.1.0"
edition = "2021"


[dependencies]
lang_ast = { path = "../lang_ast" }
lang_ty = { path = "../lang_ty" }
comment_parser = { path = "../comment_parser" }

smol_str = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true }
la-arena = { workspace = true }
derive_more = { workspace = true, features = ["debug", "from"] }
log = { workspace = true }
# TODO: replace refs to this with my own type
rnix = { workspace = true }

dashmap = "6.1.0"
rayon = { workspace = true }
petgraph = { workspace = true }
parking_lot = "0.12"
itertools = "0.14.0"
rustc-hash = "2.1.0"
smallvec = { workspace = true }
stacker = "0.1"
tracing = { workspace = true }


[dev-dependencies]
indoc = { workspace = true }
hegeltest = { workspace = true }
rowan = { workspace = true }
tempfile = "3"
divan = "0.1"
lang_ast = { path = "../lang_ast", features = ["test_support"] }
lang_ty = { path = "../lang_ty", features = ["hegel_support"] }


[lib]
path = "src/lib.rs"

[[bench]]
name = "annotations"
harness = false

[[bench]]
name = "pipeline"
harness = false
